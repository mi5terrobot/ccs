<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">

    <section class="beispiel" id="nullstellen-bestimmen">
      <h1>Nullstellen bestimmen</h1>
      <div class="aufgabe">
        <span class="aufg">Aufgabe:</span>
        Bestimme die Nullstellen von <span class="tex">f(x) = - \frac{1}{2} x^2 + 3x - 4</span>.
      </div>
      <div class="inhalt">
        <img src="img/nullstellen.png" alt="">
        <br>
        <div class="lsg">Lösung: <span class="tex">x_1 = 2, x_2 = 4</span></div>
      </div>
      <div class="navigation">Navigation</div>
    </section>

  </main>

  <script src="assets/script.js"></script>
