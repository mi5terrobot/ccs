<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/Temml-Local.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/temml.min.js"></script>

</head>

<body>

  <main class="wrap">

    <section class="beispiel" id="nullstellen-bestimmen">

      <h1>Nullstellen bestimmen</h1>

      <div class="aufgabe">
        Bestimme die Nullstellen von <span class="tex">f(x) = - \frac{1}{2} x^2 + 3x - 4</span>.
      </div>

      <div class="inhalt">

        <div class="schritt">
          <p>Entweder <strong>solve</strong> im CAS eintippen oder über: <span class="cas">b 3 1</span></p>
          <p><img src="img/nullstellen.png" alt="Graph mit Nullstellen bei 2 und 4"></p>
          <p>Lösung: <span class="tex lsg">x_1 = 2,\ x_2 = 4</span></p>
        </div>
      </div>

      <div class="navigation"></div>
    </section>

  </main>

  <script src="assets/script.js"></script>

</body>

</html>
