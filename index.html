<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathe mit STIX Two</title>

  <!-- STIX Two Text für den Text, STIX Two Math für die Formeln -->
  <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&family=STIX+Two+Math&display=swap');
  </style>

  <!-- Temml -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/Temml-Local.css">
  <script src="https://cdn.jsdelivr.net/npm/temml@0.14.0/dist/temml.min.js"></script>

  <style>
    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      font: 19px/1.55 "STIX Two Text", serif;
    }
    math {
      font-family: "STIX Two Math", math;
    }
  </style>
    
</head>
<body>

  <h1>Aufgaben</h1>

  <p>Bestimme die Nullstellen von <span class="tex">f(x) = x^3 - 3x</span>.</p>

  <p>Berechne die Ableitung <span class="tex">f'(x) = 3x^2 - 3</span> und löse <span class="tex">f'(x) = 0</span>.</p>

  <div class="tex-block">x_1 = 0, \quad x_{2,3} = \pm\sqrt{3}</div>

  <div class="tex-block">\int_0^1 x^2 \, dx = \frac{1}{3}</div>

  <script src="scriptyyo.js"></script>

</body>
</html>
